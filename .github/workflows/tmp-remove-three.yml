# Temporary: regenerates pnpm-lock.yaml without three.js. Removed again in the next commit.
name: Remove three.js (temporary)

on:
  push:
    branches: [feat/f529-content]
    paths: [.github/workflows/tmp-remove-three.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.13.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Remove packages from manifest and lockfile only
        run: pnpm remove three @react-three/fiber @react-three/drei --lockfile-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfile-without-three
          path: |
            package.json
            pnpm-lock.yaml
          retention-days: 3
