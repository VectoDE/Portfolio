name: tmp 404 reload loop check

# Temporary proof for #118/#119. Removed again before the merge.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tmp-404-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 404 loop (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-main
            ref: main
            realtime: ""
            expect_loop: "true"
          - name: head
            ref: ""
            realtime: ""
            expect_loop: "false"
          - name: head-realtime-on
            ref: ""
            realtime: "true"
            expect_loop: "false"
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/portfolio
      NEXTAUTH_SECRET: loop-test-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      NEXT_PUBLIC_REALTIME_ENABLED: ${{ matrix.realtime }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install, schema, build
        run: |
          git log -1 --format='commit %H'
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm build

      - name: Start server
        run: |
          nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Install Playwright
        working-directory: ${{ runner.temp }}
        run: |
          mkdir pw && cd pw
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.65.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Count navigations on /this-page-does-not-exist
        working-directory: ${{ runner.temp }}/pw
        env:
          EXPECT_LOOP: ${{ matrix.expect_loop }}
        run: |
          cat > check.mjs <<'JS'
          import { chromium } from "playwright"
          const url = "http://localhost:3000/this-page-does-not-exist"
          const browser = await chromium.launch()
          const page = await browser.newPage()
          let navigations = 0
          let documentRequests = 0
          let loads = 0
          page.on("framenavigated", (frame) => { if (frame === page.mainFrame()) navigations++ })
          page.on("request", (req) => { if (req.resourceType() === "document" && req.frame() === page.mainFrame()) documentRequests++ })
          page.on("load", () => { loads++ })
          const response = await page.goto(url, { waitUntil: "load", timeout: 60_000 })
          await page.waitForTimeout(30_000)
          const marker = await page.locator("[data-not-found]").count().catch(() => -1)
          const result = { url, status: response?.status(), framenavigated: navigations, documentRequests, loads, notFoundMarker: marker }
          console.log(JSON.stringify(result))
          await browser.close()
          // A full reload means a new document request; same-document history updates do not count.
          const looped = documentRequests > 1 || loads > 1
          if (process.env.EXPECT_LOOP === "true") {
            console.log(looped ? "base reproduces the loop" : "base did not loop in this run")
          } else if (looped) {
            console.error("FAIL: page kept navigating")
            process.exit(1)
          } else {
            console.log("OK: one document load in 30 s, no reload")
          }
          JS
          set -o pipefail
          node check.mjs | tee "$RUNNER_TEMP/result.json"
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            cat "$RUNNER_TEMP/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
